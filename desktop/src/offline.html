<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="color-scheme" content="dark">
<title>Fetch</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1c1c1c; color: #f5f5f2; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 360px; padding: 24px; text-align: center; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { margin: 0 0 18px; opacity: 0.7; overflow-wrap: anywhere; }
  a { display: inline-block; padding: 8px 18px; border-radius: 9px; background: #cfff04; color: #1c1c1c; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Can't reach your hub</h1>
  <p><span id="hub"></span> isn't answering. Check that it's running and that this computer is on the same network. The address can be changed under Settings in the tray menu.</p>
  <a id="retry" href="#">Try again</a>
</main>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('hub').textContent = q.get('hub') || 'The hub';
  document.getElementById('retry').href = q.get('retry') || '#';
</script>
</body>
</html>
