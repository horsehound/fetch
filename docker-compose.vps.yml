# Public server: https on your own domain, certificate handled by Caddy.
# Point the domain's DNS at the server first, then:
#
#   FETCH_DOMAIN=fetch.example.com docker compose -f docker-compose.vps.yml up -d
#   docker compose -f docker-compose.vps.yml logs hub | grep token
#
# Update to the newest release:
#
#   docker compose -f docker-compose.vps.yml pull && docker compose -f docker-compose.vps.yml up -d
services:
  hub:
    image: ${FETCH_IMAGE:-ghcr.io/horsehound/fetch:latest}
    restart: unless-stopped
    environment:
      # Who else may make a space: invite (codes from `fetch invite`), public or private.
      FETCH_MODE: ${FETCH_MODE:-invite}
      FETCH_SPACE_MB: ${FETCH_SPACE_MB:-500}
      # Visitors arrive through Caddy; their own address is in X-Forwarded-For.
      FETCH_TRUST_PROXY: "1"
    volumes:
      - fetch-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${FETCH_DOMAIN:?set FETCH_DOMAIN to your domain} --to hub:8787
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data

volumes:
  fetch-data:
  caddy-data:
