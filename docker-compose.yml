# Home network (Proxmox, NAS, any always-on box): plain http on port 8787.
#
#   docker compose up -d
#   docker compose logs hub | grep token
#
# Update to the newest release:
#
#   docker compose pull && docker compose up -d
services:
  hub:
    image: ${FETCH_IMAGE:-ghcr.io/horsehound/fetch:latest}
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - fetch-data:/data

volumes:
  fetch-data:
