name: Android device test

# Starts a real hub, runs the Android app against it on an emulator, and keeps
# screenshots of the result. Slower than the build, so it only runs when the
# Android app changes.
on:
  push:
    paths:
      - "android/**"
      - "spec/**"
      - "hub/**"
      - ".github/workflows/android-test.yml"
  workflow_dispatch:

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app and its tests
        working-directory: android
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      # Hardware acceleration for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: bash android/ci/device-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: |
            android/screens
            android/instrument.txt
          if-no-files-found: ignore
