name: Fetch
options:
  bundleIdPrefix: com.horsehound
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Fetch:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
    dependencies:
      - target: FetchShare
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Fetch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The hub is plain http on your own network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Fetch talks to your hub on your home network.
        NSPhotoLibraryAddUsageDescription: Fetch saves pictures from your other devices to your photo library.
    entitlements:
      path: Fetch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.horsehound.fetch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.horsehound.fetch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  FetchShare:
    type: app-extension
    platform: iOS
    sources:
      - Share
      - Shared
    info:
      path: Share-Info.plist
      properties:
        CFBundleDisplayName: Fetch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 30
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 30
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: FetchShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.horsehound.fetch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.horsehound.fetch.share
schemes:
  Fetch:
    build:
      targets:
        Fetch: all
